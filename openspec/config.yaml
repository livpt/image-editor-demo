schema: spec-driven

context: |
  Prioritize responsiveness and low memory use for large images in modern browsers.
  Preserve the dependency-light, client-only architecture unless a proposal justifies otherwise.
  Support current Chrome, Firefox, and Safari.
  Do not modify the generated OpenSpec Cursor commands or skills during feature work.

rules:
  proposal:
    - Include the expected performance impact.
    - State browser compatibility and memory tradeoffs.
  tasks:
    - Include verification with representative large images.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
