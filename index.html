<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Web Image Editor</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.png" />
  </head>

  <body>
    <header class="panel">
      <fieldset id="controls" class="controls" aria-label="Image tools" disabled>
        <details class="control-item menu-control">
          <summary class="tool-button">
            <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/draw.svg)"></span>
            <span>Draw</span>
          </summary>
          <div class="tool-menu">
            <button type="button" id="penDraw">Pen</button>
            <button type="button" id="lineDraw">Line</button>
            <button type="button" id="rectangleDraw">Rectangle</button>
            <button type="button" id="ellipseDraw">Ellipse</button>
          </div>
        </details>

        <button type="button" class="control-item tool-button" id="cropButton">
          <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/crop-symbol.svg)"></span>
          <span>Crop</span>
        </button>

        <button
          type="button"
          class="control-item tool-button"
          id="resizeButton"
        >
          <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/resize.svg)"></span>
          <span>Resize</span>
        </button>

        <span class="tool-sep" aria-hidden="true"></span>

        <details class="control-item menu-control">
          <summary class="tool-button">
            <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/filter.svg)"></span>
            <span>Filter</span>
          </summary>
          <div class="tool-menu">
            <button type="button" id="grayscale">Grayscale</button>
            <button type="button" id="threshold">Threshold</button>
            <button type="button" id="sepia">Sepia</button>
            <button type="button" id="invert">Invert colors</button>
          </div>
        </details>

        <span class="tool-sep" aria-hidden="true"></span>

        <button type="button" class="control-item tool-button" id="undoButton">
          <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/undo.svg)"></span>
          <span>Undo</span>
        </button>

        <button type="button" class="control-item tool-button" id="redoButton">
          <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/redo.svg)"></span>
          <span>Redo</span>
        </button>

        <span class="tool-sep" aria-hidden="true"></span>

        <button
          type="button"
          class="control-item tool-button"
          id="downloadButton"
        >
          <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/download.svg)"></span>
          <span>Save</span>
        </button>
      </fieldset>
    </header>

    <main id="dragAndDropZone" class="img-area">
      <div class="drag-helper">
        <img
          src="./assets/images/dragImg.png"
          class="drag-image"
          alt=""
        />
        <h1>Edit an image</h1>
        <p>Drag a picture anywhere onto this page, or choose a local file.</p>
        <label class="upload-button">
          Choose image
          <input id="fileInput" type="file" accept="image/*" />
        </label>
      </div>

      <p id="appStatus" class="app-status" role="status" aria-live="polite"></p>

      <div id="canvasStack" class="canvas-stack" hidden>
        <canvas id="imageProcessed"></canvas>
        <canvas id="imageOverlay" aria-label="Image editing canvas"></canvas>
      </div>
    </main>

    <aside id="layersPanel" class="layers-panel" aria-labelledby="layersTitle">
      <fieldset id="layersControls" class="layers-controls" disabled>
        <legend id="layersTitle">Layers</legend>
        <div class="layers-actions" role="toolbar" aria-label="Layer actions">
          <button type="button" id="layerAdd">Add layer</button>
          <button type="button" id="layerGroup">Add group</button>
          <button type="button" id="layerDuplicate">Duplicate</button>
          <button type="button" id="layerDelete">Delete</button>
        </div>
        <ul id="layersList" class="layers-list" role="tree" aria-label="Layer stack"></ul>
        <div class="layers-props">
          <label class="layers-prop">
            <span>Opacity</span>
            <input id="layerOpacity" type="range" min="0" max="100" step="1" value="100" />
            <output id="layerOpacityValue" for="layerOpacity">100</output>
          </label>
          <label class="layers-prop">
            <span>Blend</span>
            <select id="layerBlend">
              <option value="normal">Normal</option>
              <option value="multiply">Multiply</option>
              <option value="screen">Screen</option>
              <option value="overlay">Overlay</option>
            </select>
          </label>
        </div>
      </fieldset>
    </aside>

    <dialog id="resolutionDialog" aria-labelledby="resolutionTitle">
      <form id="resolutionForm">
        <div class="dialog-header">
          <h2 id="resolutionTitle">Resolution</h2>
          <button
            id="closeResolution"
            class="icon-button"
            type="button"
            aria-label="Close"
          >
            ×
          </button>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" checked id="checkbox-img-ratio" />
          Keep the image ratio
        </label>

        <label>
          Width
          <input type="number" min="1" step="1" id="width-size" required />
        </label>

        <label>
          Height
          <input type="number" min="1" step="1" id="height-size" required />
        </label>

        <p id="resizeError" class="form-error" role="alert"></p>

        <div class="dialog-actions">
          <button type="button" id="cancelResolution">Cancel</button>
          <button type="submit" class="primary-button" id="saveResolution">
            Save changes
          </button>
        </div>
      </form>
    </dialog>

    <details id="consolePanel" class="console-panel">
      <summary>Console</summary>
      <form id="consoleForm">
        <input
          id="consoleInput"
          type="text"
          spellcheck="false"
          autocomplete="off"
          aria-label="Command expression"
        />
        <button type="submit">Run</button>
      </form>
      <pre id="consoleLog" aria-live="polite"></pre>
    </details>

    <script type="module" src="./index.js"></script>
  </body>
</html>
