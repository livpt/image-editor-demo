<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Web Image Editor</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.png" />
  </head>

  <body>
    <header class="panel">
      <fieldset id="controls" class="controls" aria-label="Image tools" disabled>
        <details class="control-item menu-control">
          <summary class="tool-button">
            <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/draw.svg)"></span>
            <span>Draw</span>
          </summary>
          <div class="tool-menu">
            <button type="button" id="penDraw" aria-keyshortcuts="P">Pen</button>
            <button type="button" id="lineDraw" aria-keyshortcuts="U">Line</button>
            <button type="button" id="rectangleDraw" aria-keyshortcuts="U">Rectangle</button>
            <button type="button" id="ellipseDraw" aria-keyshortcuts="U">Ellipse</button>
          </div>
        </details>

        <button type="button" class="control-item tool-button" id="cropButton" aria-keyshortcuts="C">
          <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/crop-symbol.svg)"></span>
          <span>Crop</span>
        </button>

        <button
          type="button"
          class="control-item tool-button"
          id="resizeButton"
        >
          <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/resize.svg)"></span>
          <span>Resize</span>
        </button>

        <span class="tool-sep" aria-hidden="true"></span>

        <details class="control-item menu-control">
          <summary class="tool-button">
            <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/filter.svg)"></span>
            <span>Filter</span>
          </summary>
          <div class="tool-menu">
            <button type="button" id="grayscale">Grayscale</button>
            <button type="button" id="threshold">Threshold</button>
            <button type="button" id="sepia">Sepia</button>
            <button type="button" id="invert">Invert colors</button>
            <label class="brightness-row">
              Brightness
              <input id="brightnessAmount" type="number" min="-100" max="100" step="1" value="0" />
            </label>
            <button type="button" id="brightness">Apply brightness</button>
          </div>
        </details>

        <span class="tool-sep" aria-hidden="true"></span>

        <button type="button" class="control-item tool-button" id="undoButton" aria-keyshortcuts="Control+Z">
          <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/undo.svg)"></span>
          <span>Undo</span>
        </button>

        <button type="button" class="control-item tool-button" id="redoButton" aria-keyshortcuts="Control+Shift+Z Control+Y">
          <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/redo.svg)"></span>
          <span>Redo</span>
        </button>

        <span class="tool-sep" aria-hidden="true"></span>

        <button
          type="button"
          class="control-item tool-button"
          id="downloadButton"
          aria-keyshortcuts="Control+S"
        >
          <span class="tool-icon" aria-hidden="true" style="--icon: url(./assets/images/download.svg)"></span>
          <span>Save</span>
        </button>
      </fieldset>
    </header>

    <main id="dragAndDropZone" class="img-area">
      <div class="drag-helper">
        <img
          src="./assets/images/dragImg.png"
          class="drag-image"
          alt=""
        />
        <h1>Edit an image</h1>
        <p>Drag a picture anywhere onto this page, or choose a local file.</p>
        <label class="upload-button">
          Choose image
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,.msho" aria-keyshortcuts="Control+O" />
        </label>
      </div>

      <p id="appStatus" class="app-status" role="status" aria-live="polite"></p>

      <div id="canvasStack" class="canvas-stack" hidden>
        <canvas id="imageProcessed"></canvas>
        <canvas id="imageOverlay" aria-label="Image editing canvas"></canvas>
      </div>
    </main>

    <aside id="layersPanel" class="layers-panel" aria-labelledby="layersTitle">
      <fieldset id="layersControls" class="layers-controls" disabled>
        <legend id="layersTitle">Layers</legend>
        <div class="layers-actions" role="toolbar" aria-label="Layer actions">
          <button type="button" id="layerAdd">Add layer</button>
          <button type="button" id="layerGroup">Add group</button>
          <button type="button" id="layerDuplicate">Duplicate</button>
          <button type="button" id="layerDelete">Delete</button>
        </div>
        <ul id="layersList" class="layers-list" role="tree" aria-label="Layer stack"></ul>
        <div class="layers-props">
          <label class="layers-prop">
            <span>Opacity</span>
            <input id="layerOpacity" type="range" min="0" max="100" step="1" value="100" />
            <output id="layerOpacityValue" for="layerOpacity">100</output>
          </label>
          <label class="layers-prop">
            <span>Blend</span>
            <select id="layerBlend">
              <option value="normal">Normal</option>
              <option value="multiply">Multiply</option>
              <option value="screen">Screen</option>
              <option value="overlay">Overlay</option>
            </select>
          </label>
        </div>
      </fieldset>
      <section id="colourPanel" class="colour-panel" aria-label="Colour">
        <h2>Colour</h2>
        <label class="layers-prop">
          <span>Foreground</span>
          <input id="foregroundColor" type="color" value="#000000" />
        </label>
        <label class="layers-prop">
          <span>Hex</span>
          <input id="foregroundHex" type="text" value="#000000" spellcheck="false" maxlength="7" />
        </label>
        <label class="layers-prop">
          <span>RGB</span>
          <input id="foregroundRgb" type="text" value="0, 0, 0" spellcheck="false" />
        </label>
        <p class="colour-readout">Cursor <span id="cursorHex">none</span> <span id="cursorRgb"></span></p>
        <p id="documentInfo" class="document-info"></p>
      </section>
      <section id="historyPanel" class="history-panel" aria-label="History">
        <h2>History</h2>
        <ol id="historyList" class="history-list"></ol>
      </section>
    </aside>

    <dialog id="resolutionDialog" aria-labelledby="resolutionTitle">
      <form id="resolutionForm">
        <div class="dialog-header">
          <h2 id="resolutionTitle">Resolution</h2>
          <button
            id="closeResolution"
            class="icon-button"
            type="button"
            aria-label="Close"
          >
            ×
          </button>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" checked id="checkbox-img-ratio" />
          Keep the image ratio
        </label>

        <label>
          Width
          <input type="number" min="1" step="1" id="width-size" required />
        </label>

        <label>
          Height
          <input type="number" min="1" step="1" id="height-size" required />
        </label>

        <p id="resizeError" class="form-error" role="alert"></p>

        <div class="dialog-actions">
          <button type="button" id="cancelResolution">Cancel</button>
          <button type="submit" class="primary-button" id="saveResolution">
            Save changes
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="exportDialog" aria-labelledby="exportTitle">
      <form id="exportForm">
        <div class="dialog-header">
          <h2 id="exportTitle">Export</h2>
          <button id="closeExport" class="icon-button" type="button" aria-label="Close">
            ×
          </button>
        </div>

        <label>
          Filename
          <input id="exportFilename" type="text" value="edited" required spellcheck="false" />
        </label>

        <label>
          Format
          <select id="exportFormat">
            <option value="image/png">PNG</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/webp">WebP</option>
            <option value="project">Project</option>
          </select>
        </label>

        <label id="exportQualityRow" class="export-quality" hidden>
          Quality
          <input id="exportQuality" type="range" min="0.01" max="1" step="0.01" value="0.92" />
          <output id="exportQualityValue" for="exportQuality">92</output>
        </label>

        <p id="exportNote" class="form-note"></p>
        <p class="form-note">Ctrl+T is reserved by the browser and is not available.</p>
        <p id="exportError" class="form-error" role="alert"></p>

        <div class="dialog-actions">
          <button type="button" id="cancelExport">Cancel</button>
          <button type="submit" class="primary-button" id="confirmExport">Export</button>
        </div>
      </form>
    </dialog>

    <dialog id="restoreDialog" aria-labelledby="restoreTitle">
      <form id="restoreForm">
        <div class="dialog-header">
          <h2 id="restoreTitle">Restore work</h2>
        </div>
        <p id="restoreMessage"></p>
        <div class="dialog-actions">
          <button type="button" id="discardRestore">Discard</button>
          <button type="button" class="primary-button" id="confirmRestore">Restore</button>
        </div>
      </form>
    </dialog>

    <details id="consolePanel" class="console-panel">
      <summary>Console</summary>
      <form id="consoleForm">
        <input
          id="consoleInput"
          type="text"
          spellcheck="false"
          autocomplete="off"
          aria-label="Command expression"
        />
        <button type="submit">Run</button>
      </form>
      <pre id="consoleLog" aria-live="polite"></pre>
    </details>

    <script type="module" src="./index.js"></script>
  </body>
</html>
