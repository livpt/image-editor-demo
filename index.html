<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Web Image Editor</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.png" />
  </head>

  <body>
    <header class="panel">
      <fieldset id="controls" class="controls" aria-label="Image tools" disabled>
        <details class="control-item menu-control">
          <summary class="tool-button">
            <img src="./assets/images/draw.svg" alt="" />
            <span>Draw</span>
          </summary>
          <div class="tool-menu">
            <button type="button" id="penDraw">Pen</button>
            <button type="button" id="lineDraw">Line</button>
            <button type="button" id="rectangleDraw">Rectangle</button>
            <button type="button" id="ellipseDraw">Ellipse</button>
          </div>
        </details>

        <button type="button" class="control-item tool-button" id="cropButton">
          <img src="./assets/images/crop-symbol.svg" alt="" />
          <span>Crop</span>
        </button>

        <button
          type="button"
          class="control-item tool-button"
          id="resizeButton"
        >
          <img src="./assets/images/resize.svg" alt="" />
          <span>Resize</span>
        </button>

        <details class="control-item menu-control">
          <summary class="tool-button">
            <img src="./assets/images/filter.svg" alt="" />
            <span>Filter</span>
          </summary>
          <div class="tool-menu">
            <button type="button" id="grayscale">Grayscale</button>
            <button type="button" id="threshold">Threshold</button>
            <button type="button" id="sepia">Sepia</button>
            <button type="button" id="invert">Invert colors</button>
          </div>
        </details>

        <button type="button" class="control-item tool-button" id="undoButton">
          <img src="./assets/images/undo.svg" alt="" />
          <span>Undo</span>
        </button>

        <button type="button" class="control-item tool-button" id="redoButton">
          <img src="./assets/images/redo.svg" alt="" />
          <span>Redo</span>
        </button>

        <button
          type="button"
          class="control-item tool-button"
          id="downloadButton"
        >
          <img src="./assets/images/download.svg" alt="" />
          <span>Save</span>
        </button>
      </fieldset>
    </header>

    <main id="dragAndDropZone" class="img-area">
      <div class="drag-helper">
        <img
          src="./assets/images/dragImg.png"
          class="drag-image"
          alt=""
        />
        <h1>Edit an image</h1>
        <p>Drag a picture anywhere onto this page, or choose a local file.</p>
        <label class="upload-button">
          Choose image
          <input id="fileInput" type="file" accept="image/*" />
        </label>
      </div>

      <p id="appStatus" class="app-status" role="status" aria-live="polite"></p>

      <div id="canvasStack" class="canvas-stack" hidden>
        <canvas id="imageProcessed"></canvas>
        <canvas id="imageOverlay" aria-label="Image editing canvas"></canvas>
      </div>
    </main>

    <dialog id="resolutionDialog" aria-labelledby="resolutionTitle">
      <form id="resolutionForm">
        <div class="dialog-header">
          <h2 id="resolutionTitle">Resolution</h2>
          <button
            id="closeResolution"
            class="icon-button"
            type="button"
            aria-label="Close"
          >
            ×
          </button>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" checked id="checkbox-img-ratio" />
          Keep the image ratio
        </label>

        <label>
          Width
          <input type="number" min="1" step="1" id="width-size" required />
        </label>

        <label>
          Height
          <input type="number" min="1" step="1" id="height-size" required />
        </label>

        <p id="resizeError" class="form-error" role="alert"></p>

        <div class="dialog-actions">
          <button type="button" id="cancelResolution">Cancel</button>
          <button type="submit" class="primary-button" id="saveResolution">
            Save changes
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./index.js"></script>
  </body>
</html>
